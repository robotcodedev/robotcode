# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration
#
# Lines starting with "#" are comments.
# Configuration options are organized into tables and keys.
# See documentation for more information on available options.

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file. See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        {%- if not commit.scope %}
            - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))
            {%- if commit.breaking %}
            {% raw %}  {% endraw %}- **BREAKING**: {{commit.breaking_description}}
            {%- endif -%}
            {% if commit.body %}\n\n{{ commit.body | trim | indent(prefix="  ", first=true) }}\n{% endif -%}
        {%- endif -%}
    {% endfor -%}
    {% for scope, commits in commits | group_by(attribute="scope") %}
        #### {{ scope | upper_first }}
        {% for commit in commits %}
            - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))
            {%- if commit.breaking %}
            {% raw %}  {% endraw %}- **BREAKING**: {{commit.breaking_description}}
            {%- endif -%}
            {% if commit.body %}\n\n{{ commit.body | trim | indent(prefix="  ", first=true) }}\n{% endif -%}
        {%- endfor -%}
        {% raw %}\n{% endraw %}\
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# postprocessors
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/robotcodedev/robotcode" }, # replace repository URL
]
[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  # { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"}, # replace issue numbers
]
# regex for parsing and grouping commits
commit_parsers = [
  # the headings of the scopes; the scopes not listed here follow them
  { field = "scope", pattern = "^analyze$", scope = "Analyze", continue = true },
  { field = "scope", pattern = "^chat-plugin$", scope = "Chat Plugin", continue = true },
  { field = "scope", pattern = "^cli$", scope = "CLI", continue = true },
  { field = "scope", pattern = "^config$", scope = "Config", continue = true },
  { field = "scope", pattern = "^core$", scope = "Core", continue = true },
  { field = "scope", pattern = "^debugger$", scope = "Debugger", continue = true },
  { field = "scope", pattern = "^intellij$", scope = "PyCharm", continue = true },
  { field = "scope", pattern = "^(language-server|langserver|language_server)$", scope = "Language Server", continue = true },
  { field = "scope", pattern = "^plugin$", scope = "Plugin", continue = true },
  { field = "scope", pattern = "^repl$", scope = "REPL", continue = true },
  { field = "scope", pattern = "^robot$", scope = "Robot", continue = true },
  { field = "scope", pattern = "^robotcode$", scope = "RobotCode", continue = true },
  { field = "scope", pattern = "^runner$", scope = "Runner", continue = true },
  { field = "scope", pattern = "^textmate$", scope = "TextMate", continue = true },
  { field = "scope", pattern = "^vscode$", scope = "VS Code", continue = true },
  { field = "scope", pattern = "^(docs|website)$", scope = "Website", continue = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^Feat", group = "<!-- 0 -->Features" },
  { message = "^Feature", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^docs\\(openspec\\)", skip = true },
  { message = "^doc", group = "<!-- 2 -->Documentation" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^style", group = "<!-- 5 -->Styling", skip = true },
#  { message = "^test", group = "Testing" },
  { message = "^test", group = "Testing",  skip = true },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(.*\\)", group = "Miscellaneous Tasks", skip = true },
  { message = "^chore|ci", group = "Miscellaneous Tasks", skip = true },
  { message = "^bump", skip = true },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
  # a commit that only a scope parser matched would otherwise get a group named after its type
  { message = ".*", skip = true },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = true
# regex for matching git tags
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+-*"

# regex for skipping tags
skip_tags = ""
# regex for ignoring tags
ignore_tags = "v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|dev)\\.[0-9]+"
# sort the tags topologically
topo_order = true
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
# limit the number of commits included in the changelog.
# limit_commits = 42
