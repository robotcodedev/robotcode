name: publish dev build

on:
  # not at the full hour, when GitHub delays scheduled runs under load
  schedule:
    - cron: "23 2 * * *"

  workflow_dispatch:

# reads the runs and artifacts of the build workflow
permissions:
  actions: read
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Update npm
        # Node.js bundles an older npm; use the current one, as in local development.
        run: npm install -g npm@latest

      - name: install node modules
        run: npm install --include=dev

      - name: publish the JetBrains plugin of the latest successful build of main to the channel dev
        run: hatch -q run build:publish-dev jetbrains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

      - name: publish the VS Code extension of the latest successful build of main as pre-release
        # also when the JetBrains upload failed
        if: ${{ !cancelled() }}
        run: hatch -q run build:publish-dev vscode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
