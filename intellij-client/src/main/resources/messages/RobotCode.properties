run.target.paths.browse = Add Files or Folders...
run.target.paths.comment = Files and folders separated by spaces, in quotes when they contain spaces; the expanded field shows one per line. Without any, the paths of <code>robot.toml</code> run, or the project folder when it sets none. Given paths replace the paths of <code>robot.toml</code>, and the top-level suite is then named after the given path.
run.target.selection.comment = Full names as Robot Framework names the test, task or suite, separated by spaces, in quotes when they contain spaces, for example <code>"Project.Tests.Sample.First Test"</code>; the expanded field shows one per line.
run.profile.notSupported = Robot Framework runs cannot be profiled.
run.target.selection.empty = No tests or suites are given, so the run covers the configured paths.
