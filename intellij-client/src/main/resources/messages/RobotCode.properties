projectService = Project service: {0}
randomLabel = The random number is: {0}
shuffle = Shuffle
command.typing.name = Typing

settings.robotframework.displayName = Robot Framework
settings.general.displayName = General
settings.general.disableExtension = Disable extension
settings.general.disableExtension.comment = Switches RobotCode off for this project: no language server, no test discovery, no run markers and no banner. The value is stored for you only, in the workspace file of the project. Stopping the RobotCode server in the Language Servers tool window switches it off only until RobotCode is restarted.
settings.general.extraArgs = Extra args:
settings.general.extraArgs.comment = Global <code>robotcode</code> options for the commands that the plugin runs in the background for the project, such as test discovery. The language server and test runs do not get them. Arguments are separated by spaces; quote an argument that contains spaces. The value is stored for you only, in the workspace file of the project.
settings.general.profiles = Profiles:
settings.general.profiles.default = default-profiles from robot.toml
settings.general.profiles.select = Select...
settings.general.profiles.comment = The <code>robot.toml</code> profiles that the language server, test discovery and test runs get as <code>-p</code>. Without a selection, the <code>default-profiles</code> of <code>robot.toml</code> apply, which is the place for a default that the team shares; unchecking every profile returns to them. The selection is stored for you only, in the workspace file of the project.
settings.editing.displayName = Editing
settings.editing.completion = Completion
settings.editing.completion.filterDefaultLanguage = Filter default language
settings.editing.completion.filterDefaultLanguage.comment = When a file uses another language, for example with <code>Language: German</code>, completion leaves out the English section headers, settings and boolean values.
settings.editing.completion.headerStyle = Header style:
settings.editing.completion.headerStyle.comment = The format of the section headers that completion inserts, where <code>{name}</code> stands for the name of the section. When it is empty, completion uses <code>*** {name} ***</code> from Robot Framework 6 on and <code>*** {name}s ***</code> before.
settings.editing.completion.hidePrivateKeywords = Hide private keywords
settings.editing.completion.hidePrivateKeywords.comment = Completion does not offer keywords tagged <code>robot:private</code> that are defined in another file, including private library keywords. When this is off, completion offers them marked as private and sorted after the other keywords.
settings.editing.completion.hideDeprecatedKeywords = Hide deprecated keywords
settings.editing.completion.hideDeprecatedKeywords.comment = Completion does not offer deprecated keywords, wherever they are defined. When this is off, completion offers them struck through and sorted after the other keywords.
settings.editing.inlayHints = Inlay Hints
settings.editing.inlayHints.parameterNames = Parameter names
settings.editing.inlayHints.parameterNames.comment = Shows the parameter names in front of the arguments of keyword calls, such as <code>first=</code>.
settings.editing.inlayHints.namespaces = Namespaces
settings.editing.inlayHints.namespaces.comment = Shows the library or resource a keyword comes from, such as <code>BuiltIn.</code> for <code>Log</code>, in front of keyword calls without such a prefix.
settings.editing.inlayHints.comment = Inlay hints can also be hidden in Settings | Editor | Inlay Hints.
settings.robot.displayName = Robot
settings.robot.args = Args:
settings.robot.args.comment = Robot Framework options that test discovery and test runs pass after their own options. Arguments are separated by spaces; quote an argument that contains spaces. They add to the options of <code>robot.toml</code>, and run configurations add their robot arguments after these.
settings.robot.paths = Paths:
settings.robot.paths.comment = The files and folders that test discovery and test runs use as default paths, passed as <code>-dp</code>, separated by semicolons; without any, the project folder. They are used only when <code>robot.toml</code> sets no <code>paths</code> and a run names no files or folders. A run configuration that runs other files or folders names them as its target.
settings.robot.pythonPath = Python path:
settings.robot.pythonPath.comment = Folders or glob patterns, separated by semicolons, that the language server puts on the Python path for its analysis and that test discovery and test runs pass as <code>-P</code>. They add to the Python path of <code>robot.toml</code>, and run configurations add their Python path after these.
settings.robot.addContentRoots = Add content roots to the Python path
settings.robot.addContentRoots.comment = Puts the content roots of the module whose Python interpreter RobotCode uses, and of the modules it depends on, on the Python path of the analysis, test discovery and test runs, after the folders entered under Python path, like PyCharm's Python run configurations. The project folder is usually a content root.
settings.robot.addSourceRoots = Add source roots to the Python path
settings.robot.addSourceRoots.comment = Puts the folders marked as Sources or Test Sources in these modules on the Python path, after the content roots. For runs on the command line, list the folders under <code>python-path</code> in <code>robot.toml</code>.
settings.robot.env = Env:
settings.robot.env.comment = Environment variables for the language server and for test runs; test discovery does not get them. In the editor they win over the environment of <code>robot.toml</code>, but in test runs the environment of <code>robot.toml</code> wins. A run configuration's environment variable of the same name wins over these.
settings.robot.languages = Languages:
settings.robot.languages.comment = The languages that Robot Framework files can be written in, as names or codes separated by semicolons, for the language server, test discovery and test runs (<code>--language</code>); needs Robot Framework 6 or newer. They add to the languages of <code>robot.toml</code>. A run configuration that sets languages uses its own instead.
settings.robot.variables = Variables:
settings.robot.variables.comment = Variables for the language server and for test runs (<code>-v name:value</code>); test discovery does not get them. A variable set here wins over the same variable from <code>robot.toml</code>, and a run configuration's variable of the same name wins over it.
settings.robot.variableFiles = Variable files:
settings.robot.variableFiles.comment = Variable files, separated by semicolons, for the language server and for test runs (<code>-V</code>); test discovery does not get them. They add to the variable files of <code>robot.toml</code>, and run configurations add their variable files after these.
settings.robot.outputDir = Output dir:
settings.robot.outputDir.comment = The folder that test runs write their output files to (<code>-d</code>). It replaces the output directory of <code>robot.toml</code>. A run configuration that sets an output directory uses its own instead.
settings.robot.mode = Mode:
settings.robot.mode.comment = Default passes nothing, so <code>robot.toml</code> and the suites decide; RPA passes <code>--rpa</code> and Test automation <code>--norpa</code>, to test discovery and test runs. Run configurations with the mode Inherit take this mode.
settings.robot.mode.default = Default
settings.robot.mode.rpa = RPA
settings.robot.mode.norpa = Test automation
settings.run.displayName = Run
settings.run.openOutputAfterRun = Open output after run:
settings.run.openOutputAfterRun.comment = The file that opens when a test run ends: nothing, the report or the log that the run wrote.
settings.run.openOutputAfterRun.none = Nothing
settings.run.openOutputAfterRun.report = Report
settings.run.openOutputAfterRun.log = Log
settings.run.openOutputTarget = Open output target:
settings.run.openOutputTarget.comment = Where the report or the log opens, after a run and with Open Report and Open Log: in the built-in preview, in the default browser or in a browser of Settings | Tools | Web Browsers and Preview, as with Open In | Browser of an HTML file.
settings.run.openOutputTarget.preview = Built-in preview
settings.run.openOutputTarget.default = Default browser
settings.debug.displayName = Debug
settings.debug.launchWrapper = Launch wrapper:
settings.debug.launchWrapper.comment = A command that test runs are launched through to prepare their environment, such as <code>xvfb-run -a</code>; the command line of the run is appended to it. Arguments are separated by spaces; quote an argument that contains spaces. It replaces the <code>wrapper</code> of the selected <code>robot.toml</code> profile; when it is empty, that wrapper applies.
settings.debug.outputMessages = Output messages
settings.debug.outputMessages.comment = Robot Framework's own messages, which keywords do not write, in the output of test runs. Its errors and warnings outside of keywords are shown in any case.
settings.debug.outputLog = Output log
settings.debug.outputLog.comment = The messages that keywords log, such as those of <code>Log</code>, in the output of test runs.
settings.debug.outputTimestamps = Output timestamps
settings.debug.outputTimestamps.comment = A timestamp at the start of each of these messages.
settings.runDefaults.comment = The runs of Robot Framework run configurations use these values unless a configuration sets its own in its "Run & Debug" options.
settings.analysis.displayName = Analysis
settings.analysis.diagnosticMode = Diagnostic mode:
settings.analysis.diagnosticMode.openFilesOnly = Open files only
settings.analysis.diagnosticMode.workspace = Workspace
settings.analysis.diagnosticMode.comment = Open files only reports the problems of the files that are open in an editor. Workspace reports the problems of all Robot Framework files of the project, and the Project view marks the files that contain errors.
settings.analysis.progressMode = Progress mode:
settings.analysis.progressMode.off = Off
settings.analysis.progressMode.simple = Simple
settings.analysis.progressMode.detailed = Detailed
settings.analysis.progressMode.comment = Shows the progress of the analysis. Simple shows how many files are analyzed, Detailed also shows the name of the file that is being analyzed.
settings.analysis.findUnusedReferences = Find unused references
settings.analysis.findUnusedReferences.comment = Marks keywords, arguments and variables that nothing uses, with messages such as <code>Keyword 'Login' is not used.</code>
settings.analysis.referencesCodeLens = References code lens
settings.analysis.referencesCodeLens.comment = Shows a line such as <code>2 references</code> above each keyword definition.
settings.analysis.fileCheckInterval = File check interval:
settings.analysis.fileCheckInterval.minutes = minutes
settings.analysis.fileCheckInterval.comment = How often the language server checks the files of the project, from 1 to 1440 minutes. The check finds created, changed and deleted files, also when the IDE does not report them.
settings.analysis.fileCheckInterval.invalid = Enter a whole number from 1 to 1440.
settings.analysis.cache = Cache
settings.analysis.cache.saveLocation = Save location:
settings.analysis.cache.saveLocation.workspaceStorage = IDE system directory
settings.analysis.cache.saveLocation.workspaceFolder = Project folder
settings.analysis.cache.saveLocation.comment = The IDE system directory keeps the cache out of the project. The project folder keeps it in <code>.robotcode_cache</code>, the folder that <code>robotcode analyze</code> also uses when it runs in the project.
settings.analysis.cache.ignoredLibraries = Ignored libraries:
settings.analysis.cache.ignoredLibraries.comment = Libraries that the analysis does not cache, such as dynamic or hybrid libraries whose keywords depend on their arguments.
settings.analysis.cache.ignoredVariables = Ignored variables:
settings.analysis.cache.ignoredVariables.comment = Variable files that the analysis does not cache, such as variable files whose variables depend on their arguments.
settings.analysis.cache.ignoreArgumentsForLibrary = Ignore arguments for library:
settings.analysis.cache.ignoreArgumentsForLibrary.comment = Libraries that the analysis loads without their arguments, such as libraries that get large dictionaries from a Python file that the analysis cannot handle. The library must also work without these arguments.
settings.analysis.cache.comment = Enter library or module names, or glob patterns for the source file, such as <code>MyLib</code>, <code>mylib.submodule</code> or <code>**/lib/mylib.py</code>, separated by semicolons. For the libraries of Robot Framework, use the full module name, such as <code>robot.libraries.Remote</code>. The entries are added to those in <code>robot.toml</code>. For entries that are already cached, use Tools | RobotCode | Clear Cache and Restart RobotCode Language Server.
settings.analysis.robot = Robot
settings.analysis.robot.globalLibrarySearchOrder = Global library search order:
settings.analysis.robot.globalLibrarySearchOrder.comment = Libraries and resources in the order in which the analysis looks up keywords with the same name, as the keyword <code>Set Library Search Order</code> sets it. The analysis does not see calls of <code>Set Library Search Order</code>, so call it in your tests as well. The entries are added to those in <code>robot.toml</code>.
settings.analysis.robot.loadLibraryTimeout = Load library timeout:
settings.analysis.robot.loadLibraryTimeout.seconds = seconds
settings.analysis.robot.loadLibraryTimeout.comment = How long loading a library or variable file may take during the analysis, from 1 to 3600 seconds. It replaces the timeout from <code>robot.toml</code>. When the field is empty, the timeout from <code>robot.toml</code> or from the environment variable <code>ROBOTCODE_LOAD_LIBRARY_TIMEOUT</code> applies, or else 10 seconds.
settings.analysis.robot.loadLibraryTimeout.invalid = Enter a whole number from 1 to 3600, or leave the field empty.
settings.analysis.diagnosticModifiers = Diagnostic Modifiers
settings.analysis.diagnosticModifiers.comment = Diagnostic codes, such as <code>KeywordNotFound</code>, whose problems are ignored or reported at another level, separated by semicolons. <code>*</code> stands for all codes that are in no other list. The codes are added to those in <code>[tool.robotcode-analyze.modifiers]</code> in <code>robot.toml</code>.
settings.analysis.diagnosticModifiers.ignore = Ignore:
settings.analysis.diagnosticModifiers.error = Error:
settings.analysis.diagnosticModifiers.warning = Warning:
settings.analysis.diagnosticModifiers.information = Information:
settings.analysis.diagnosticModifiers.information.comment = Shown as weak warnings, which the Problems view lists.
settings.analysis.diagnosticModifiers.hint = Hint:
settings.analysis.diagnosticModifiers.hint.comment = Not listed in the Problems view; their message appears when you hover over the problem.
settings.analysis.workspace = Workspace
settings.analysis.workspace.excludePatterns = Exclude patterns:
settings.analysis.workspace.excludePatterns.comment = Files and folders that the language server leaves out when it loads the Robot Framework files of the project, for example for Find Usages, separated by semicolons. The patterns use <code>.gitignore</code> syntax, such as <code>generated/</code>, and are added to those in <code>robot.toml</code>.
settings.analysis.experimental = Experimental
settings.analysis.experimental.semanticModel = Semantic model
settings.analysis.experimental.semanticModel.comment = Analyzes the files with the new semantic model instead of the current analyzer. It is experimental and may change without notice.

settings.robocop.displayName = Robocop
settings.robocop.enabled = Enabled
settings.robocop.enabled.comment = Shows the problems that Robocop finds, when Robocop is installed in the Python interpreter of the project. Switching this off does not switch off formatting with Robocop.
settings.robocop.configFile = Config file:
settings.robocop.configFile.comment = Robocop reads its configuration from this file, as with its <code>--config</code> option.
settings.robocop.ignoreGitDir = Ignore Git dir
settings.robocop.ignoreGitDir.comment = When Robocop searches for configuration files, it does not stop at a folder that contains <code>.git</code>, as with its <code>--ignore-git-dir</code> option.
settings.robocop.ignoreFileConfig = Ignore file config
settings.robocop.ignoreFileConfig.comment = Robocop does not load configuration files, as with its <code>--ignore-file-config</code> option.

settings.languageServer.displayName = Language Server
settings.languageServer.extraArgs = Extra args:
settings.languageServer.extraArgs.comment = Global <code>robotcode</code> options that the language server gets before <code>language-server</code>, such as <code>--log --log-level DEBUG</code>. The output they cause appears in the RobotCode entry of the Language Servers tool window. Arguments are separated by spaces; quote an argument that contains spaces. The value is stored for you only, in the workspace file of the project.

