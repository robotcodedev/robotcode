run.options.variables.name = Variables
run.options.variables.label = Variables:
run.options.variables.column.name = Name
run.options.variables.column.value = Value
run.options.variables.comment = Passed as <code>-v name:value</code>. A variable set here overrides the same variable from <code>robot.toml</code> and from the Robot settings page.
run.options.variableFiles.name = Variable files
run.options.variableFiles.label = Variable files:
run.options.variableFiles.add = Add Files...
run.options.variableFiles.comment = Passed as <code>-V</code>, after the variable files of <code>robot.toml</code> and of the Robot settings page. Separate the files with spaces and quote a file that contains spaces.
run.options.pythonPath.name = Python path
run.options.pythonPath.label = Python path:
run.options.pythonPath.comment = Passed as <code>-P</code>, after the Python path of <code>robot.toml</code> and of the Robot settings page. Separate the entries with spaces and quote an entry that contains spaces.
run.options.languages.name = Languages
run.options.languages.label = Languages:
run.options.languages.comment = Passed as <code>--language</code>, after the languages of <code>robot.toml</code> and instead of those of the Robot settings page; needs Robot Framework 6 or newer. Separate the languages with spaces.
run.options.includeTags.name = Include tags
run.options.includeTags.label = Include tags:
run.options.includeTags.comment = Passed as <code>-i</code>, after the include tags of <code>robot.toml</code>. Separate the tags with spaces and quote a tag that contains spaces.
run.options.excludeTags.name = Exclude tags
run.options.excludeTags.label = Exclude tags:
run.options.excludeTags.comment = Passed as <code>-e</code>, after the exclude tags of <code>robot.toml</code>. Separate the tags with spaces and quote a tag that contains spaces.
run.options.outputDir.name = Output directory
run.options.outputDir.label = Output directory:
run.options.outputDir.comment = Passed as <code>-d</code>. It replaces the output directory of <code>robot.toml</code> and of the Robot settings page.
run.options.mode.name = Mode
run.options.mode.label = Mode:
run.options.mode.comment = Inherit takes the mode of the Robot settings page, and passes nothing while that is Default, so <code>robot.toml</code> and the suites decide.
run.options.mode.inherit = Inherit
run.options.mode.rpa = RPA
run.options.mode.norpa = Test automation
run.options.dryRun.name = Dry run
