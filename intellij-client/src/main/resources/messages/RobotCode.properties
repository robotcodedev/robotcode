python.noRobotFramework = Robot Framework is not installed in the Python interpreter of the project. RobotCode needs Python 3.10 or newer with Robot Framework 5.0 or newer.
python.robotTooOld = The Python interpreter of the project has Robot Framework {0}, which is older than 5.0. RobotCode needs Python 3.10 or newer with Robot Framework 5.0 or newer.
python.remote = The Python interpreter of the project is a remote interpreter, such as WSL, Docker or SSH, which RobotCode does not support yet. RobotCode needs Python 3.10 or newer with Robot Framework 5.0 or newer.
python.checkFailed = The check of the Python interpreter of the project failed: {0} Choose Tools | RobotCode | Restart RobotCode Language Server to check it again. RobotCode needs Python 3.10 or newer with Robot Framework 5.0 or newer.
python.check.timeout = it did not answer within 30 seconds.
