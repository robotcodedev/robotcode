run.options.profiles.label = Configuration profiles:
run.options.profiles.comment = Project selection uses the profiles selected for the project on the General page. Default profiles of robot.toml passes none, so that the <code>default-profiles</code> of <code>robot.toml</code> apply. Custom passes the profiles listed here, separated by spaces, and without any the <code>default-profiles</code> apply.
run.options.profiles.project = Project selection
run.options.profiles.defaults = Default profiles of robot.toml
